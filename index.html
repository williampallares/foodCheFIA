<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodChefIA 👨‍🍳</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            text-align: center;
            padding: 40px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #202024;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h1 { color: #00b37e; font-size: 28px; }
        input {
            width: 80%;
            padding: 12px;
            border: 2px solid #29292e;
            border-radius: 6px;
            background: #121214;
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
        }
        button {
            background-color: #00b37e;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #00875f; }
        #respuesta {
            margin-top: 25px;
            padding: 15px;
            background: #29292e;
            border-radius: 6px;
            text-align: left;
            white-space: pre-line;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FoodChefIA 🍳</h1>
        <p>Escribe qué ingredientes tienes en la heladera y FoodChefIA te dirá qué cocinar:</p>
        
        <input type="text" id="ingredientes" placeholder="Ej: huevo, tomate, queso...">
        <br>
        <button onclick="pedirReceta()">¡Generar Receta!</button>

        <div id="respuesta">FoodChefIA está esperando tus ingredientes...</div>
    </div>

    <script>
        // Registro del Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
                    .catch(err => console.error('Error al registrar el Service Worker:', err));
            });
        }

        async function pedirReceta() {
            const input = document.getElementById('ingredientes').value;
            const respuestaDiv = document.getElementById('respuesta');

            if (!input) {
                respuestaDiv.innerText = "⚠️ Por favor, escribe algún ingrediente.";
                return;
            }

            respuestaDiv.innerText = "🔄 FoodChefIA está pensando en tu receta... Por favor espera.";

            const promptCompleto = `Eres FoodChefIA, un chef experto y amigable. El usuario tiene estos ingredientes: ${input}. Preséntate brevemente como FoodChefIA y sugiere una receta rápida, fácil y deliciosa detallando los pasos.`;

            try {
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(promptCompleto)}`);
                
                if (!response.ok) throw new Error();

                const data = await response.text();
                respuestaDiv.innerText = data;

            } catch (error) {
                respuestaDiv.innerText = "❌ ¡Ups! El servidor de FoodChefIA está saturado o estás sin conexión. Inténtalo de nuevo en unos segundos.";
            }
        }
    </script>
</body>
</html>
