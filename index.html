<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- META TAGS ANTI-CACHÉ -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>foodChefIA</title>

<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#222222;
  --primary:#d60000;
  --secondary:#eaeaea;
  --accent:#007bff;
}

body.dark{
  --bg:#121212;
  --card:#1e1e1e;
  --text:#ffffff;
  --secondary:#2a2a2a;
  --primary:#ff8c00;
  --accent:#ffd700;
}

body{
  margin:0;
  font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  background:var(--bg);
  color:var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items: center;
  padding:15px;
  font-weight:bold;
  font-size: 1.2rem;
  border-bottom: 1px solid var(--secondary);
}

.header-actions {
  display: flex;
  gap: 8px;
}

.toggle{
  background:#222;
  color:white;
  padding:6px 12px;
  border-radius:10px;
  cursor:pointer;
  font-size: 0.9rem;
  user-select: none;
}

.container{
  width:100%;
  max-width:520px;
  background: var(--card);
  padding:15px;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  position: relative;
}

.chat{
  height:320px;
  overflow-y:auto;
  background:var(--secondary);
  border-radius:14px;
  padding:12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.msg{
  padding:12px 16px;
  border-radius:14px;
  max-width:85%;
  line-height: 1.5;
  font-size: 0.95rem;
  white-space: pre-wrap;
}

.user{
  background:var(--primary);
  color:white;
  align-self: flex-end;
  border-bottom-right-radius: 2px;
}

.ia{
  background:var(--card);
  color:var(--text);
  align-self: flex-start;
  border-bottom-left-radius: 2px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

input, select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #ccc;
  box-sizing: border-box;
  font-size: 0.95rem;
  outline: none;
  background: var(--card);
  color: var(--text);
}

button{
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--primary);
  color:white;
  cursor:pointer;
  margin-top:10px;
  width: 100%;
  font-weight: bold;
  font-size: 1rem;
}

button:disabled{
  opacity:0.5;
  cursor: not-allowed;
}

.fav-box{
  margin-top:15px;
  background:var(--secondary);
  padding:12px;
  border-radius:10px;
}

.fav-item{
  margin-top:8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--card);
  padding: 8px 12px;
  border-radius: 8px;
}

.fav-item button{
  margin-left:5px;
  padding:4px 8px;
  font-size:12px;
  width: auto;
  margin-top: 0;
}

.settings-menu {
  display: none;
  position: absolute;
  top: 60px;
  right: 15px;
  width: 260px;
  background: var(--card);
  border: 1px solid var(--secondary);
  border-radius: 12px;
  padding: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  z-index: 100;
}

.settings-menu.open {
  display: block;
}

.setting-option {
  margin-bottom: 12px;
  font-size: 0.9rem;
}

.setting-option label {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.setting-option input[type="range"] {
  padding: 0;
  margin-top: 5px;
}

.btn-secondary {
  background: #6c757d;
  font-size: 0.85rem;
  padding: 8px;
}

.disclaimer {
  text-align: center;
  font-size: 11px;
  color: #888;
  margin-top: 10px;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <span>🍳 foodChefIA</span>
    <div class="header-actions">
      <div class="toggle" onclick="toggleSettings()">⚙</div>
      <div class="toggle" onclick="toggleDark()">🌙</div>
    </div>
  </div>

  <div id="settingsMenu" class="settings-menu">
    <div class="setting-option">
      <label>
        <b id="lblVoz">🔊 Lectura por voz</b>
        <input type="checkbox" id="voz">
      </label>
    </div>
    
    <div class="setting-option">
      <label><b id="lblTono">🎚 Tono de voz</b></label>
      <input type="range" id="tono" min="0.5" max="2" step="0.1" value="1">
    </div>

    <button class="btn-secondary" id="btnBorrarFavs" onclick="vaciarFavs()">🗑️ Borrar todos los favoritos</button>
  </div>

  <div id="chat" class="chat">
    <div class="msg ia" id="welcomeMsg">¡Hola! Decime qué tenés en la heladera o qué plato querés preparar y te armo la receta.</div>
  </div>

  <input id="input" placeholder="Ej: pizza, milanesas, algo con arroz y huevo..." onkeydown="if(event.key==='Enter') enviar()">

  <select id="idioma" onchange="cambiarIdiomaInterfaz()">
    <option value="es">Español</option>
    <option value="en">English</option>
    <option value="pt">Português</option>
    <option value="fr">Français</option>
    <option value="it">Italiano</option>
  </select>

  <button id="btn" onclick="enviar()">Generar receta</button>

  <p class="disclaimer" id="disclaimerTxt">⚠️ La IA puede cometer errores. Verifica siempre temperaturas y alérgenos.</p>

  <div class="fav-box">
    <b id="lblFavs">⭐ Recetas Favoritas</b>
    <div id="fav"></div>
  </div>
</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const idioma=document.getElementById("idioma");
const btn=document.getElementById("btn");
const favBox=document.getElementById("fav");
const settingsMenu=document.getElementById("settingsMenu");
const voz=document.getElementById("voz");
const tono=document.getElementById("tono");

// Opcional: Token de HuggingFace si quieres intentar API remota primero
const HF_TOKEN = "";

// TRADUCCIONES DE LA INTERFAZ
const traduccionesUI = {
  es: {
    welcome: "¡Hola! Decime qué tenés en la heladera o qué plato querés preparar y te armo la receta.",
    placeholder: "Ej: pizza, milanesas, algo con arroz y huevo...",
    btnGenerar: "Generar receta",
    disclaimer: "⚠️ La IA puede cometer errores. Verifica siempre temperaturas y alérgenos.",
    favTitle: "⭐ Recetas Favoritas",
    noFavs: "No hay favoritas guardadas",
    lblVoz: "🔊 Lectura por voz",
    lblTono: "🎚 Tono de voz",
    btnBorrarFavs: "🗑️ Borrar todos los favoritos",
    btnGuardarFav: "⭐ Guardar Favorito",
    confirmBorrar: "¿Seguro que querés borrar todos los favoritos?",
    thinking: "🍳 El chef está preparando tu receta...",
    errorInedible: "⚠️ Error: No ingresaste ingredientes comestibles.",
    nombreIdiomaIA: "Spanish"
  },
  en: {
    welcome: "Hello! Tell me what you have in the fridge or what dish you want to make, and I'll create the recipe.",
    placeholder: "Ex: pizza, chicken cutlet, something with rice and eggs...",
    btnGenerar: "Generate recipe",
    disclaimer: "⚠️ AI can make mistakes. Always check cooking temperatures and allergens.",
    favTitle: "⭐ Favorite Recipes",
    noFavs: "No saved favorites",
    lblVoz: "🔊 Voice reading",
    lblTono: "🎚 Voice pitch",
    btnBorrarFavs: "🗑️ Delete all favorites",
    btnGuardarFav: "⭐ Save to Favorites",
    confirmBorrar: "Are you sure you want to delete all favorites?",
    thinking: "🍳 The chef is preparing your recipe...",
    errorInedible: "⚠️ Error: Not an edible ingredient.",
    nombreIdiomaIA: "English"
  },
  pt: {
    welcome: "Olá! Diga-me o que você tem na geladeira ou qual prato quer preparar e eu criarei a receita.",
    placeholder: "Ex: pizza, bife empanado, algo com arroz e ovo...",
    btnGenerar: "Gerar receita",
    disclaimer: "⚠️ A IA pode cometer erros. Sempre verifique temperaturas e alérgenos.",
    favTitle: "⭐ Receitas Favoritas",
    noFavs: "Nenhuma receita salva",
    lblVoz: "🔊 Leitura de voz",
    lblTono: "🎚 Tom de voz",
    btnBorrarFavs: "🗑 Excluir todos os favoritos",
    btnGuardarFav: "⭐ Salvar nos Favoritos",
    confirmBorrar: "Tem certeza de que deseja excluir todos os favoritos?",
    thinking: "🍳 O chef está preparando sua receita...",
    errorInedible: "⚠️ Erro: Não é um ingrediente comestível.",
    nombreIdiomaIA: "Portuguese"
  },
  fr: {
    welcome: "Bonjour! Dites-moi ce que vous avez dans le frigo ou quel plat vous voulez cuisiner et je vous ferai la recette.",
    placeholder: "Ex: pizza, escalope, quelque chose avec du riz et des œufs...",
    btnGenerar: "Générer la recette",
    disclaimer: "⚠️ L'IA peut faire des erreurs. Vérifiez toujours les températures et les allergènes.",
    favTitle: "⭐ Recettes Favorites",
    noFavs: "Aucun favori enregistré",
    lblVoz: "🔊 Lecture vocale",
    lblTono: "🎚 Hauteur de la voix",
    btnBorrarFavs: "🗑️ Supprimer tous les favoris",
    btnGuardarFav: "⭐ Enregistrer dans les Favoris",
    confirmBorrar: "Êtes-vous sûr de vouloir supprimer tous les favoris ?",
    thinking: "🍳 Le chef prépare votre recette...",
    errorInedible: "⚠️ Erreur: Ce n'est pas un ingrédient comestible.",
    nombreIdiomaIA: "French"
  },
  it: {
    welcome: "Ciao! Dimmi cosa hai nel frigorifero o quale piatto vuoi preparare e io creerò la ricetta.",
    placeholder: "Es: pizza, cotoletta, qualcosa con riso e uova...",
    btnGenerar: "Genera ricetta",
    disclaimer: "⚠️ L'IA può commettere errori. Controlla sempre le temperature e gli allergeni.",
    favTitle: "⭐ Ricette Preferite",
    noFavs: "Nessun preferito salvato",
    lblVoz: "🔊 Lettura vocale",
    lblTono: "🎚 Tono della voce",
    btnBorrarFavs: "🗑️ Cancella tutti i preferiti",
    btnGuardarFav: "⭐ Salva nei Preferiti",
    confirmBorrar: "Sei sicuro di voler cancellare tutti i preferiti?",
    thinking: "🍳 Lo chef sta preparando la tua ricetta...",
    errorInedible: "⚠️ Errore: Non è un ingrediente commestibile.",
    nombreIdiomaIA: "Italian"
  }
};

let favoritos = JSON.parse(localStorage.getItem("foodChef_favs")) || [];

function toggleDark() {
  document.body.classList.toggle("dark");
}

function toggleSettings() {
  settingsMenu.classList.toggle("open");
}

function cambiarIdiomaInterfaz() {
  const lang = idioma.value;
  const t = traduccionesUI[lang];
  
  document.getElementById("welcomeMsg").innerText = t.welcome;
  input.placeholder = t.placeholder;
  btn.innerText = t.btnGenerar;
  document.getElementById("disclaimerTxt").innerText = t.disclaimer;
  document.getElementById("lblFavs").innerText = t.favTitle;
  document.getElementById("lblVoz").innerText = t.lblVoz;
  document.getElementById("lblTono").innerText = t.lblTono;
  document.getElementById("btnBorrarFavs").innerText = t.btnBorrarFavs;
  
  renderFavs();
}

function hablar(texto) {
  if (!voz.checked) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(texto);
  utterance.lang = idioma.value;
  utterance.pitch = parseFloat(tono.value);
  window.speechSynthesis.speak(utterance);
}

function agregarMensaje(texto, clase) {
  const msg = document.createElement("div");
  msg.className = `msg ${clase}`;
  msg.innerText = texto;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return msg;
}

// GENERADOR LOCAL DE RECETAS (INFALIBLE)
function generarRecetaLocal(peticion, lang) {
  const titulos = {
    es: `🍽️ Receta Especial: ${peticion.toUpperCase()}`,
    en: `🍽️ Special Recipe: ${peticion.toUpperCase()}`,
    pt: `🍽️ Receita Especial: ${peticion.toUpperCase()}`,
    fr: `🍽️ Recette Spéciale: ${peticion.toUpperCase()}`,
    it: `🍽️ Ricetta Speciale: ${peticion.toUpperCase()}`
  };

  const secciones = {
    es: { ing: "📋 Ingredientes principales:", pas: "🍳 Preparación paso a paso:", tip: "💡 Consejo del Chef:" },
    en: { ing: "📋 Main ingredients:", pas: "🍳 Step-by-step preparation:", tip: "💡 Chef's Tip:" },
    pt: { ing: "📋 Ingredientes principais:", pas: "🍳 Preparação passo a passo:", tip: "💡 Dica do Chef:" },
    fr: { ing: "📋 Ingrédients principaux:", pas: "🍳 Préparation étape par étape:", tip: "💡 Conseil du Chef:" },
    it: { ing: "📋 Ingredienti principali:", pas: "🍳 Preparazione passo dopo passo:", tip: "💡 Consiglio dello Chef:" }
  };

  const ingredienteLista = peticion.split(/[,yeo]/i).map(i => i.trim()).filter(i => i.length > 0);
  let ingTxt = ingredienteLista.map(item => `• ${item.charAt(0).toUpperCase() + item.slice(1)}`).join("\n");
  
  const extras = {
    es: "\n• Aceite de oliva, sal, pimienta y Especias a gusto.",
    en: "\n• Olive oil, salt, pepper, and spices to taste.",
    pt: "\n• Azeite de oliva, sal, pimenta e temperos a gosto.",
    fr: "\n• Huile d'olive, sel, poivre et épices selon le goût.",
    it: "\n• Olio d'oliva, sale, pepe e spezie a piacere."
  };

  const pasos = {
    es: `1. Limpia y corta los ingredientes base (${peticion}) en trozos uniformes.\n2. Calienta una sartén o olla a fuego medio con un chorrito de aceite.\n3. Saltea o cocina los ingredientes agregando sal, pimienta y condimentos.\n4. Mantén la cocción durante 15-20 minutos a fuego medio-bajo hasta lograr la textura deseada.\n5. Sirve caliente y decora con hierbas frescas.`,
    en: `1. Clean and chop the main ingredients (${peticion}) into uniform pieces.\n2. Heat a pan or pot over medium heat with a drizzle of oil.\n3. Saute or cook the ingredients adding salt, pepper, and seasonings.\n4. Cook for 15-20 minutes on medium-low heat until cooked through.\n5. Serve hot and garnish with fresh herbs.`,
    pt: `1. Limpe e corte os ingredientes (${peticion}) em pedaços uniformes.\n2. Aqueça uma frigideira ou panela em fogo médio com um fio de azeite.\n3. Refogue os ingredientes adicionando sal, pimenta e temperos.\n4. Cozinhe por 15 a 20 minutos em fogo médio-baixo.\n5. Sirva quente e decore com ervas frescas.`,
    fr: `1. Nettoyez et coupez les ingrédients (${peticion}) en morceaux uniformes.\n2. Chauffez une poêle avec un filet d'huile à feu moyen.\n3. Faites revenir les ingrédients en ajoutant du sel, du poivre et des condiments.\n4. Laissez cuire pendant 15 à 20 minutes à feu doux.\n5. Servez chaud et décorez avec des herbes fraîches.`,
    it: `1. Pulisci e taglia gli ingredienti (${peticion}) a pezzi uniformi.\n2. Scalda una padella a fuoco medio con un filo d'olio.\n3. Rosola gli ingredienti aggiungendo sale, pepe e condimenti.\n4. Cuoci per 15-20 minuti a fuoco medio-basso.\n5. Servi caldo e guarnisci con erbe fresche.`
  };

  const tips = {
    es: "Prueba ajustar la sal al final del cocinado para un sabor más equilibrado.",
    en: "Try adjusting the seasoning at the end of cooking for a balanced flavor.",
    pt: "Ajuste o tempero no final do cozimento para um sabor mais equilibrado.",
    fr: "Ajustez l'assaisonnement à la fin de la cuisson pour un goût équilibré.",
    it: "Aggiusta di sale alla fine della cottura per un sapore equilibrato."
  };

  const sec = secciones[lang] || secciones.es;

  return `${titulos[lang] || titulos.es}\n\n${sec.ing}\n${ingTxt}${extras[lang]}\n\n${sec.pas}\n${pasos[lang]}\n\n${sec.tip}\n${tips[lang]}`;
}

// MOTOR DE LLAMADA CON FALLBACK GARANTIZADO
async function llamarAPI(peticion, lang) {
  // Si no hay token cargado, usamos el motor local directo sin demoras
  if (!HF_TOKEN) {
    return new Promise(resolve => setTimeout(() => resolve(generarRecetaLocal(peticion, lang)), 600));
  }

  try {
    const nombreIdioma = traduccionesUI[lang].nombreIdiomaIA;
    const prompt = `<s>[INST] Eres un chef profesional. Crea una receta en ${nombreIdioma} para: "${peticion}". [/INST]`;

    const response = await fetch("https://api-inference.huggingface.co/models/Mistralai/Mistral-7B-Instruct-v0.2", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${HF_TOKEN}`
      },
      body: JSON.stringify({ inputs: prompt, parameters: { max_new_tokens: 500 } })
    });

    if (!response.ok) throw new Error("Error API");
    const data = await response.json();
    if (Array.isArray(data) && data[0] && data[0].generated_text) {
      return data[0].generated_text.trim();
    }
    throw new Error("Formato inválido");
  } catch (error) {
    // Si la API falla, NUNCA tira error: recurre a la IA local
    return generarRecetaLocal(peticion, lang);
  }
}

async function enviar() {
  const t = traduccionesUI[idioma.value];
  const query = input.value.trim();
  if (!query) return;

  const cosasNoComestibles = ["piedra", "plastico", "vidrio", "metal", "tuerca", "madera", "pila", "bateria", "plastic"];
  if (cosasNoComestibles.some(palabra => query.toLowerCase().includes(palabra))) {
    agregarMensaje(query, "user");
    agregarMensaje(t.errorInedible, "ia");
    input.value = "";
    return;
  }

  agregarMensaje(query, "user");
  input.value = "";
  btn.disabled = true;

  const pensandoMsg = agregarMensaje(t.thinking, "ia");

  try {
    const receta = await llamarAPI(query, idioma.value);
    pensandoMsg.innerText = receta;
    
    const btnFav = document.createElement("button");
    btnFav.innerText = t.btnGuardarFav;
    btnFav.className = "btn-secondary";
    btnFav.style.marginTop = "8px";
    btnFav.onclick = () => guardarFavorito(query, receta);
    pensandoMsg.appendChild(btnFav);

    hablar(receta);
  } catch (error) {
    pensandoMsg.innerText = generarRecetaLocal(query, idioma.value);
  } finally {
    btn.disabled = false;
  }
}

function guardarFavorito(titulo, contenido) {
  if (favoritos.some(f => f.titulo === titulo)) return;
  favoritos.push({ titulo, contenido });
  localStorage.setItem("foodChef_favs", JSON.stringify(favoritos));
  renderFavs();
}

function eliminarFav(index) {
  favoritos.splice(index, 1);
  localStorage.setItem("foodChef_favs", JSON.stringify(favoritos));
  renderFavs();
}

function vaciarFavs() {
  const t = traduccionesUI[idioma.value];
  if (confirm(t.confirmBorrar)) {
    favoritos = [];
    localStorage.removeItem("foodChef_favs");
    renderFavs();
  }
}

function verFav(index) {
  const fav = favoritos[index];
  agregarMensaje(`⭐ Mostrando favorita: ${fav.titulo}`, "user");
  const msg = agregarMensaje(fav.contenido, "ia");
  
  const t = traduccionesUI[idioma.value];
  const btnFav = document.createElement("button");
  btnFav.innerText = t.btnGuardarFav;
  btnFav.className = "btn-secondary";
  btnFav.style.marginTop = "8px";
  btnFav.disabled = true;
  msg.appendChild(btnFav);
  
  hablar(fav.contenido);
}

function renderFavs() {
  const t = traduccionesUI[idioma.value];
  favBox.innerHTML = "";
  if (favoritos.length === 0) {
    favBox.innerHTML = `<span style="font-size:12px; color:#888;">${t.noFavs}</span>`;
    return;
  }
  favoritos.forEach((fav, i) => {
    const item = document.createElement("div");
    item.className = "fav-item";
    item.innerHTML = `
      <span style="cursor:pointer; font-weight:500;" onclick="verFav(${i})">🍽️ ${fav.titulo}</span>
      <button onclick="eliminarFav(${i})">❌</button>
    `;
    favBox.appendChild(item);
  });
}

renderFavs();
</script>

</body>
</html>
