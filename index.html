<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodChefIA</title>
<style>
  * {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
  }
  body {
    background-color: #121212;
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background-color: #23272a;
    border-radius: 12px;
    padding: 30px 20px;
    width: 100%;
    max-width: 500px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  h1 {
    color: #00bc7e;
    font-size: 28px;
    margin-top: 0;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  p {
    color: #cccccc;
    font-size: 14px;
    margin-bottom: 20px;
    line-height: 1.4;
  }
  input[type="text"] {
    width: 100%;
    padding: 12px 15px;
    border-radius: 6px;
    border: 1px solid #33373b;
    background-color: #1a1c1e;
    color: #ffffff;
    font-size: 14px;
    margin-bottom: 15px;
    outline: none;
  }
  input[type="text"]::placeholder {
    color: #72767d;
  }
  button.btn-generar {
    background-color: #00bc7e;
    color: #ffffff;
    border: none;
    border-radius: 6px;
    padding: 12px 24px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
    width: auto;
  }
  button.btn-generar:hover {
    background-color: #00a06b;
  }
  .resultado {
    margin-top: 25px;
    background-color: #1a1c1e;
    border-radius: 6px;
    padding: 15px;
    color: #a0a0a0;
    font-size: 14px;
    text-align: left;
    min-height: 50px;
    word-break: break-word;
  }
</style>
</head>
<body>

<div class="card">
  <h1>FoodChefIA 🍳</h1>
  <p>Escribe qué ingredientes tienes en la heladera y FoodChefIA te dirá qué cocinar:</p>
  
  <input type="text" id="ingredientes" placeholder="Ej: huevo, tomate, queso..." onkeydown="if(event.key==='Enter') generarReceta()">
  
  <button class="btn-generar" onclick="generarReceta()">¡Generar Receta!</button>
  
  <div id="resultado" class="resultado">
    FoodChefIA está esperando tus ingredientes...
  </div>
</div>

<script>
// Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('Service Worker listo:', reg.scope))
      .catch(err => console.error('Error Service Worker:', err));
  });
}

async function generarReceta() {
  const input = document.getElementById('ingredientes');
  const resultado = document.getElementById('resultado');
  const txt = input.value.trim();

  if (!txt) return;

  resultado.innerText = 'Pensando receta con FoodChefIA...';

  try {
    const prompt = "Actúa como FoodChefIA. Con estos ingredientes: " + txt + ", dame una receta rápida y sencilla en español.";
    const res = await fetch("https://text.pollinations.ai/" + encodeURIComponent(prompt) + "?model=openai");
    
    if (!res.ok) throw new Error();
    const data = await res.text();
    resultado.innerText = data;
  } catch (e) {
    resultado.innerText = "🍳 Receta rápida con " + txt + ":\nMezclá los ingredientes en una sartén con un chorrito de aceite, salpimentá a gusto y cociná a fuego medio por 10-15 minutos.";
  }
}
</script>

</body>
</html>
