<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- META TAGS ANTI-CACHÉ -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>foodChefIA</title>

<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#222222;
  --primary:#d60000;
  --secondary:#eaeaea;
  --accent:#007bff;
}

body.dark{
  --bg:#121212;
  --card:#1e1e1e;
  --text:#ffffff;
  --secondary:#2a2a2a;
  --primary:#ff8c00;
  --accent:#ffd700;
}

body{
  margin:0;
  font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  background:var(--bg);
  color:var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items: center;
  padding:15px;
  font-weight:bold;
  font-size: 1.2rem;
  border-bottom: 1px solid var(--secondary);
}

.header-actions {
  display: flex;
  gap: 8px;
}

.toggle{
  background:#222;
  color:white;
  padding:6px 12px;
  border-radius:10px;
  cursor:pointer;
  font-size: 0.9rem;
  user-select: none;
}

.container{
  width:100%;
  max-width:520px;
  background: var(--card);
  padding:15px;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  position: relative;
}

.chat{
  height:320px;
  overflow-y:auto;
  background:var(--secondary);
  border-radius:14px;
  padding:12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.msg{
  padding:12px 16px;
  border-radius:14px;
  max-width:85%;
  line-height: 1.4;
  font-size: 0.95rem;
}

.user{
  background:var(--primary);
  color:white;
  align-self: flex-end;
  border-bottom-right-radius: 2px;
}

.ia{
  background:var(--card);
  color:var(--text);
  align-self: flex-start;
  border-bottom-left-radius: 2px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

input, select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #ccc;
  box-sizing: border-box;
  font-size: 0.95rem;
  outline: none;
  background: var(--card);
  color: var(--text);
}

button{
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--primary);
  color:white;
  cursor:pointer;
  margin-top:10px;
  width: 100%;
  font-weight: bold;
  font-size: 1rem;
}

button:disabled{
  opacity:0.5;
}

.fav-box{
  margin-top:15px;
  background:var(--secondary);
  padding:12px;
  border-radius:10px;
}

.fav-item{
  margin-top:8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--card);
  padding: 8px 12px;
  border-radius: 8px;
}

.fav-item button{
  margin-left:5px;
  padding:4px 8px;
  font-size:12px;
  width: auto;
  margin-top: 0;
}

.settings-menu {
  display: none;
  position: absolute;
  top: 60px;
  right: 15px;
  width: 260px;
  background: var(--card);
  border: 1px solid var(--secondary);
  border-radius: 12px;
  padding: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  z-index: 100;
}

.settings-menu.open {
  display: block;
}

.setting-option {
  margin-bottom: 12px;
  font-size: 0.9rem;
}

.setting-option label {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.setting-option input[type="range"] {
  padding: 0;
  margin-top: 5px;
}

.btn-secondary {
  background: #6c757d;
  font-size: 0.85rem;
  padding: 8px;
}

.disclaimer {
  text-align: center;
  font-size: 11px;
  color: #888;
  margin-top: 10px;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <span>🍳 foodChefIA</span>
    <div class="header-actions">
      <div class="toggle" onclick="toggleSettings()">⚙️</div>
      <div class="toggle" onclick="toggleDark()">🌙</div>
    </div>
  </div>

  <div id="settingsMenu" class="settings-menu">
    <div class="setting-option">
      <label>
        <b id="lblVoz">🔊 Lectura por voz</b>
        <input type="checkbox" id="voz">
      </label>
    </div>
    
    <div class="setting-option">
      <label><b id="lblTono">🎚 Tono de voz</b></label>
      <input type="range" id="tono" min="0.5" max="2" step="0.1" value="1">
    </div>

    <button class="btn-secondary" id="btnBorrarFavs" onclick="vaciarFavs()">🗑️ Borrar todos los favoritos</button>
  </div>

  <div id="chat" class="chat">
    <div class="msg ia" id="welcomeMsg">¡Hola! Decime qué tenés en la heladera o qué plato querés preparar y te armo la receta.</div>
  </div>

  <input id="input" placeholder="Ej: pizza, milanesas, algo con arroz y huevo..." onkeydown="if(event.key==='Enter') enviar()">

  <select id="idioma" onchange="cambiarIdiomaInterfaz()">
    <option value="es">Español</option>
    <option value="en">English</option>
    <option value="pt">Português</option>
    <option value="fr">Français</option>
    <option value="it">Italiano</option>
  </select>

  <button id="btn" onclick="enviar()">Generar receta</button>

  <p class="disclaimer" id="disclaimerTxt">⚠️ La IA puede cometer errores. Verifica siempre temperaturas y alérgenos.</p>

  <div class="fav-box">
    <b id="lblFavs">⭐ Recetas Favoritas</b>
    <div id="fav"></div>
  </div>
</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const idioma=document.getElementById("idioma");
const btn=document.getElementById("btn");
const favBox=document.getElementById("fav");
const settingsMenu=document.getElementById("settingsMenu");
const voz=document.getElementById("voz");
const tono=document.getElementById("tono");

// TRADUCCIONES DE LA INTERFAZ
const traduccionesUI = {
  es: {
    welcome: "¡Hola! Decime qué tenés en la heladera o qué plato querés preparar y te armo la receta.",
    placeholder: "Ej: pizza, milanesas, algo con arroz y huevo...",
    btnGenerar: "Generar receta",
    disclaimer: "⚠️ La IA puede cometer errores. Verifica siempre temperaturas y alérgenos.",
    favTitle: "⭐ Recetas Favoritas",
    noFavs: "No hay favoritas guardadas",
    lblVoz: "🔊 Lectura por voz",
    lblTono: "🎚 Tono de voz",
    btnBorrarFavs: "🗑️ Borrar todos los favoritos",
    btnGuardarFav: "⭐ Guardar en Favoritos",
    confirmBorrar: "¿Seguro que querés borrar todos los favoritos?",
    thinking: "🍳 El chef está pensando la receta...",
    errorInedible: "⚠️ Error: No es un ingrediente comestible.",
    nombreIdiomaIA: "Spanish"
  },
  en: {
    welcome: "Hello! Tell me what you have in the fridge or what dish you want to make, and I'll create the recipe.",
    placeholder: "Ex: pizza, chicken cutlet, something with rice and eggs...",
    btnGenerar: "Generate recipe",
    disclaimer: "⚠️ AI can make mistakes. Always check cooking temperatures and allergens.",
    favTitle: "⭐ Favorite Recipes",
    noFavs: "No saved favorites",
    lblVoz: "🔊 Voice reading",
    lblTono: "🎚 Voice pitch",
    btnBorrarFavs: "🗑️ Delete all favorites",
    btnGuardarFav: "⭐ Save to Favorites",
    confirmBorrar: "Are you sure you want to delete all favorites?",
    thinking: "🍳 The chef is thinking about the recipe...",
    errorInedible: "⚠️ Error: Not an edible ingredient.",
    nombreIdiomaIA: "English"
  },
  pt: {
    welcome: "Olá! Diga-me o que você tem na geladeira ou qual prato quer preparar e eu criarei a receita.",
    placeholder: "Ex: pizza, bife empanado, algo com arroz e ovo...",
    btnGenerar: "Gerar receita",
    disclaimer: "⚠️ A IA pode cometer erros. Sempre verifique temperaturas e alérgenos.",
    favTitle: "⭐ Receitas Favoritas",
    noFavs: "Nenhuma receita salva",
    lblVoz: "🔊 Leitura de voz",
    lblTono: "🎚 Tom de voz",
    btnBorrarFavs: "🗑️ Excluir todos os favoritos",
    btnGuardarFav: "⭐ Salvar nos Favoritos",
    confirmBorrar: "Tem certeza de que deseja excluir todos os favoritos?",
    thinking: "🍳 O chef está pensando na receita...",
    errorInedible: "⚠️ Erro: Não é um ingrediente comestível.",
    nombreIdiomaIA: "Portuguese"
  },
  fr: {
    welcome: "Bonjour! Dites-moi ce que vous avez dans le frigo ou quel plat vous voulez cuisiner et je vous ferai la recette.",
    placeholder: "Ex: pizza, escalope, quelque chose avec du riz et des œufs...",
    btnGenerar: "Générer la recette",
    disclaimer: "⚠️ L'IA peut commettre des erreurs. Vérifiez toujours les températures et les allergènes.",
    favTitle: "⭐ Recettes Préférées",
    noFavs: "Aucun favori enregistré",
    lblVoz: "🔊 Lecture vocale",
    lblTono: "🎚 Tonalité de la voix",
    btnBorrarFavs: "🗑️ Supprimer tous les favoris",
    btnGuardarFav: "⭐ Enregistrer dans les Favoris",
    confirmBorrar: "Êtes-vous sûr de vouloir supprimer tous les favoris?",
    thinking: "🍳 Le chef réfléchit à la recette...",
    errorInedible: "⚠️ Erreur: Ce n'est pas un ingrédient comestible.",
    nombreIdiomaIA: "French"
  },
  it: {
    welcome: "Ciao! Dimmi cosa hai in frigorifero o quale piatto vuoi preparare e ti creo la ricetta.",
    placeholder: "Es: pizza, cotoletta, qualcosa con riso e uova...",
    btnGenerar: "Genera ricetta",
    disclaimer: "⚠️ L'IA può commettere errori. Verifica sempre temperature e allergeni.",
    favTitle: "⭐ Ricette Preferite",
    noFavs: "Nessun preferito salvato",
    lblVoz: "🔊 Lettura vocale",
    lblTono: "🎚 Tono della voce",
    btnBorrarFavs: "🗑️ Elimina tutti i preferiti",
    btnGuardarFav: "⭐ Salva nei Preferiti",
    confirmBorrar: "Sei sicuro di voler eliminare tutti i preferiti?",
    thinking: "🍳 Lo chef sta pensando alla ricetta...",
    errorInedible: "⚠️ Errore: Non è un ingrediente commestibile.",
    nombreIdiomaIA: "Italian"
  }
};

function cambiarIdiomaInterfaz() {
  const lang = idioma.value;
  const ui = traduccionesUI[lang] || traduccionesUI.es;

  input.placeholder = ui.placeholder;
  btn.innerText = ui.btnGenerar;
  document.getElementById("disclaimerTxt").innerText = ui.disclaimer;
  document.getElementById("lblFavs").innerText = ui.favTitle;
  document.getElementById("lblVoz").innerText = ui.lblVoz;
  document.getElementById("lblTono").innerText = ui.lblTono;
  document.getElementById("btnBorrarFavs").innerText = ui.btnBorrarFavs;

  const welcomeMsg = document.getElementById("welcomeMsg");
  if (welcomeMsg) {
    welcomeMsg.innerText = ui.welcome;
  }
  
  pintarFav();
}

function toggleDark(){
  document.body.classList.toggle("dark");
}

function toggleSettings(){
  settingsMenu.classList.toggle("open");
}

let favs=JSON.parse(localStorage.getItem("favs"))||[];

function guardarFav(t){
  if(!favs.includes(t)){
    favs.push(t);
    localStorage.setItem("favs",JSON.stringify(favs));
    pintarFav();
  }
}

function borrarFav(texto){
  favs=favs.filter(f=>f!==texto);
  localStorage.setItem("favs",JSON.stringify(favs));
  pintarFav();
}

function vaciarFavs(){
  const lang = idioma.value;
  const ui = traduccionesUI[lang] || traduccionesUI.es;
  if(confirm(ui.confirmBorrar)){
    favs=[];
    localStorage.removeItem("favs");
    pintarFav();
  }
}

function pintarFav(){
  const lang = idioma.value;
  const ui = traduccionesUI[lang] || traduccionesUI.es;
  favBox.innerHTML="";
  
  if(favs.length === 0){
    favBox.innerHTML = `<small style='color:gray;'>${ui.noFavs}</small>`;
    return;
  }
  favs.forEach(f=>{
    const d=document.createElement("div");
    d.className="fav-item";
    d.innerHTML=`
    <span>⭐ ${f}</span>
    <div>
      <button onclick="borrarFav('${f}')">🗑</button>
    </div>
    `;
    favBox.appendChild(d);
  });
}

function hablar(texto, lang) {
  if (!voz.checked) return;
  let textoLimpio = texto.replace(/<[^>]*>?/gm, '');

  const mapaIdiomas = {
    'es': 'es-ES',
    'en': 'en-US',
    'pt': 'pt-BR',
    'fr': 'fr-FR',
    'it': 'it-IT'
  };

  const s = new SpeechSynthesisUtterance(textoLimpio);
  s.pitch = parseFloat(tono.value);
  s.lang = mapaIdiomas[lang] || 'es-ES';
  speechSynthesis.cancel();
  speechSynthesis.speak(s);
}

async function solicitarIA(promptTexto, langKey) {
  const ui = traduccionesUI[langKey] || traduccionesUI.es;
  
  const systemPrompt = `You are a professional chef. You MUST write your ENTIRE response strictly in ${ui.nombreIdiomaIA}. Use simple HTML tags (<b>, <br>):\n<b>🍳 [RECIPE NAME IN ${ui.nombreIdiomaIA}]</b><br><br><b>⏱️ Time:</b> X min<br><br><b>🛒 Ingredients:</b><br>- Ingredient 1<br><br><b>🔥 Steps:</b><br>1. Step one.<br>2. Step two.`;
  
  const url = "https://text.pollinations.ai/" + encodeURIComponent(systemPrompt + "\n\nUser request: " + promptTexto) + "?model=openai";

  const res = await fetch(url);
  if (!res.ok) throw new Error("Error en servidor de IA");
  return await res.text();
}

async function obtenerReceta(consulta) {
  const clave = consulta.toLowerCase().trim();
  const langKey = idioma.value;
  const ui = traduccionesUI[langKey] || traduccionesUI.es;

  const palabrasProhibidas = ["uranio", "plastico", "vidrio", "piedra", "veneno", "bobicraft", "uranium", "plastic", "glass"];
  if (palabrasProhibidas.some(p => clave.includes(p))) {
    return `${ui.errorInedible}`;
  }

  try {
    let respuestaIA = await solicitarIA(clave, langKey);
    if(respuestaIA && respuestaIA.length > 20) {
      return respuestaIA.replace(/\n/g, "<br>");
    }
  } catch (e) {
    console.log("Error consultando IA");
  }

  return `<b>🍳 ${clave.toUpperCase()}</b><br><br><b>🛒 Ingredients:</b><br>- ${clave}<br><br><b>🔥 Steps:</b><br>1. Cook well.`;
}

async function enviar(){
  const t = input.value.trim();
  if(!t) return;

  const langKey = idioma.value;
  const ui = traduccionesUI[langKey] || traduccionesUI.es;

  btn.disabled = true;
  chat.innerHTML += `<div class="msg user">${t}</div>`;

  const ia = document.createElement("div");
  ia.className = "msg ia";
  ia.innerHTML = ui.thinking;
  chat.appendChild(ia);
  chat.scrollTop = chat.scrollHeight;

  let resultado = await obtenerReceta(t);

  ia.innerHTML = resultado;

  const b = document.createElement("button");
  b.style.width = "auto";
  b.style.marginTop = "8px";
  b.innerText = ui.btnGuardarFav;
  b.onclick = () => guardarFav(t);
  ia.appendChild(b);

  hablar(resultado, langKey);

  input.value = "";
  chat.scrollTop = chat.scrollHeight;
  btn.disabled = false;
}

cambiarIdiomaInterfaz();
</script>

</body>
</html>
