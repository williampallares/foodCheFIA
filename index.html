<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>William's FoodAI 👨‍🍳</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            text-align: center;
            padding: 40px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #202024;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h1 { color: #00b37e; font-size: 28px; }
        input {
            width: 80%;
            padding: 12px;
            border: 2px solid #29292e;
            border-radius: 6px;
            background: #121214;
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
        }
        button {
            background-color: #00b37e;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #00875f; }
        #respuesta {
            margin-top: 25px;
            padding: 15px;
            background: #29292e;
            border-radius: 6px;
            text-align: left;
            white-space: pre-line;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Chef Virtual AI 👨‍🍳</h1>
        <p>Escribe qué ingredientes tienes en la nevera y William's AI te dirá qué cocinar:</p>
        
        <input type="text" id="ingredientes" placeholder="Ej: huevo, tomate, queso...">
        <br>
        <button onclick="pedirReceta()">¡Generar Receta!</button>

        <div id="respuesta">La IA está esperando tus ingredientes...</div>
    </div>

    <script>
        async function pedirReceta() {
            const input = document.getElementById('ingredientes').value.trim();
            const respuestaDiv = document.getElementById('respuesta');

            if (!input) {
                respuestaDiv.innerText = "⚠️ Por favor, escribe algún ingrediente.";
                return;
            }

            respuestaDiv.innerText = "🔄 El Chef IA está pensando en tu receta... Por favor espera.";

            // Le damos una estructura rígida para obligarla a responder como receta
            const promptCompleto = `Actúa como un chef profesional. El usuario tiene únicamente estos ingredientes: ${input}.
Crea una receta detallada usando este formato obligatorio:

🍳 NOMBRE DE LA RECETA
⏱️ TIEMPO DE PREPARACIÓN:

🛒 INGREDIENTES NECESARIOS:
- Ingrediente 1
- Ingrediente 2

🔥 PASO A PASO:
1. Primer paso
2. Segundo paso

💡 CONSEJO DEL CHEF:
Un tip para que quede mejor.`;

            try {
                // Dirección URL de la API de texto corregida con el signo $ y el modelo estético searchgpt
                const url = `https://text.pollinations.ai/${encodeURIComponent(promptCompleto)}?model=searchgpt`;
                
                const response = await fetch(url);
                
                if (!response.ok) throw new Error("Error en la respuesta del servidor");

                const data = await response.text();
                
                // Si la respuesta no vino vacía, la mostramos
                if (data.trim() !== "") {
                    respuestaDiv.innerText = data;
                } else {
                    throw new Error("Respuesta vacía");
                }

            } catch (error) {
                respuestaDiv.innerText = "❌ ¡Ups! Ocurrió un error al conectar con la IA. Inténtalo de nuevo en unos segundos.";
            }
        }
    </script>
</body>
</html>
