<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- META TAGS ANTI-CACHÉ -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>foodChefIA</title>

<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#222222;
  --primary:#d60000;
  --secondary:#eaeaea;
  --accent:#007bff;
}

body.dark{
  --bg:#121212;
  --card:#1e1e1e;
  --text:#ffffff;
  --secondary:#2a2a2a;
  --primary:#ff8c00;
  --accent:#ffd700;
}

body{
  margin:0;
  font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  background:var(--bg);
  color:var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items: center;
  padding:15px;
  font-weight:bold;
  font-size: 1.2rem;
  border-bottom: 1px solid var(--secondary);
}

.header-actions {
  display: flex;
  gap: 8px;
}

.toggle{
  background:#222;
  color:white;
  padding:6px 12px;
  border-radius:10px;
  cursor:pointer;
  font-size: 0.9rem;
  user-select: none;
}

.container{
  width:100%;
  max-width:520px;
  background: var(--card);
  padding:15px;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  position: relative;
}

.chat{
  height:320px;
  overflow-y:auto;
  background:var(--secondary);
  border-radius:14px;
  padding:12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.msg{
  padding:12px 16px;
  border-radius:14px;
  max-width:85%;
  line-height: 1.5;
  font-size: 0.95rem;
  white-space: pre-wrap;
}

.user{
  background:var(--primary);
  color:white;
  align-self: flex-end;
  border-bottom-right-radius: 2px;
}

.ia{
  background:var(--card);
  color:var(--text);
  align-self: flex-start;
  border-bottom-left-radius: 2px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

input, select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #ccc;
  box-sizing: border-box;
  font-size: 0.95rem;
  outline: none;
  background: var(--card);
  color: var(--text);
}

button{
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--primary);
  color:white;
  cursor:pointer;
  margin-top:10px;
  width: 100%;
  font-weight: bold;
  font-size: 1rem;
}

button:disabled{
  opacity:0.5;
  cursor: not-allowed;
}

.fav-box{
  margin-top:15px;
  background:var(--secondary);
  padding:12px;
  border-radius:10px;
}

.fav-item{
  margin-top:8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--card);
  padding: 8px 12px;
  border-radius: 8px;
}

.fav-item button{
  margin-left:5px;
  padding:4px 8px;
  font-size:12px;
  width: auto;
  margin-top: 0;
}

.settings-menu {
  display: none;
  position: absolute;
  top: 60px;
  right: 15px;
  width: 260px;
  background: var(--card);
  border: 1px solid var(--secondary);
  border-radius: 12px;
  padding: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  z-index: 100;
}

.settings-menu.open {
  display: block;
}

.setting-option {
  margin-bottom: 12px;
  font-size: 0.9rem;
}

.setting-option label {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.setting-option input[type="range"] {
  padding: 0;
  margin-top: 5px;
}

.btn-secondary {
  background: #6c757d;
  font-size: 0.85rem;
  padding: 8px;
}

.disclaimer {
  text-align: center;
  font-size: 11px;
  color: #888;
  margin-top: 10px;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <span>🍳 foodChefIA</span>
    <div class="header-actions">
      <div class="toggle" onclick="toggleSettings()">⚙</div>
      <div class="toggle" onclick="toggleDark()">🌙</div>
    </div>
  </div>

  <div id="settingsMenu" class="settings-menu">
    <div class="setting-option">
      <label>
        <b id="lblVoz">🔊 Lectura por voz</b>
        <input type="checkbox" id="voz">
      </label>
    </div>
    
    <div class="setting-option">
      <label><b id="lblTono">🎚 Tono de voz</b></label>
      <input type="range" id="tono" min="0.5" max="2" step="0.1" value="1">
    </div>

    <button class="btn-secondary" id="btnBorrarFavs" onclick="vaciarFavs()">🗑️ Borrar todos los favoritos</button>
  </div>

  <div id="chat" class="chat">
    <div class="msg ia" id="welcomeMsg">¡Hola! Decime qué tenés en la heladera o qué plato querés preparar y te armo la receta.</div>
  </div>

  <input id="input" placeholder="Ej: pizza, milanesas, algo con arroz y huevo..." onkeydown="if(event.key==='Enter') enviar()">

  <select id="idioma" onchange="cambiarIdiomaInterfaz()">
    <option value="es">Español</option>
    <option value="en">English</option>
    <option value="pt">Português</option>
    <option value="fr">Français</option>
    <option value="it">Italiano</option>
  </select>

  <button id="btn" onclick="enviar()">Generar receta</button>

  <p class="disclaimer" id="disclaimerTxt">⚠️ La IA puede cometer errores. Verifica siempre temperaturas y alérgenos.</p>

  <div class="fav-box">
    <b id="lblFavs">⭐ Recetas Favoritas</b>
    <div id="fav"></div>
  </div>
</div>

const chat=document.getElementById("chat");

</body>
</html>
