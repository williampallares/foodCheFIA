<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>foodChefIA</title>

<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#222222;
  --primary:#d60000;
  --secondary:#eaeaea;
  --accent:#007bff;
}

body.dark{
  --bg:#121212;
  --card:#1e1e1e;
  --text:#ffffff;
  --secondary:#2a2a2a;
  --primary:#ff8c00;
  --accent:#ffd700;
}

body{
  margin:0;
  font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  background:var(--bg);
  color:var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items: center;
  padding:15px;
  font-weight:bold;
  font-size: 1.2rem;
  border-bottom: 1px solid var(--secondary);
}

.header-actions {
  display: flex;
  gap: 8px;
}

.toggle{
  background:#222;
  color:white;
  padding:6px 12px;
  border-radius:10px;
  cursor:pointer;
  font-size: 0.9rem;
  user-select: none;
}

.container{
  width:100%;
  max-width:520px;
  background: var(--card);
  padding:15px;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  position: relative;
}

.chat{
  height:320px;
  overflow-y:auto;
  background:var(--secondary);
  border-radius:14px;
  padding:12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.msg{
  padding:12px 16px;
  border-radius:14px;
  max-width:85%;
  line-height: 1.4;
  font-size: 0.95rem;
}

.user{
  background:var(--primary);
  color:white;
  align-self: flex-end;
  border-bottom-right-radius: 2px;
}

.ia{
  background:var(--card);
  color:var(--text);
  align-self: flex-start;
  border-bottom-left-radius: 2px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

input, select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #ccc;
  box-sizing: border-box;
  font-size: 0.95rem;
  outline: none;
  background: var(--card);
  color: var(--text);
}

button{
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--primary);
  color:white;
  cursor:pointer;
  margin-top:10px;
  width: 100%;
  font-weight: bold;
  font-size: 1rem;
}

button:disabled{
  opacity:0.5;
}

.fav-box{
  margin-top:15px;
  background:var(--secondary);
  padding:12px;
  border-radius:10px;
}

.fav-item{
  margin-top:8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--card);
  padding: 8px 12px;
  border-radius: 8px;
}

.fav-item button{
  margin-left:5px;
  padding:4px 8px;
  font-size:12px;
  width: auto;
  margin-top: 0;
}

.settings-menu {
  display: none;
  position: absolute;
  top: 60px;
  right: 15px;
  width: 260px;
  background: var(--card);
  border: 1px solid var(--secondary);
  border-radius: 12px;
  padding: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  z-index: 100;
}

.settings-menu.open {
  display: block;
}

.setting-option {
  margin-bottom: 12px;
  font-size: 0.9rem;
}

.setting-option label {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.setting-option input[type="range"] {
  padding: 0;
  margin-top: 5px;
}

.btn-secondary {
  background: #6c757d;
  font-size: 0.85rem;
  padding: 8px;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <span>🍳 foodChefIA</span>
    <div class="header-actions">
      <div class="toggle" onclick="toggleSettings()">⚙️</div>
      <div class="toggle" onclick="toggleDark()">🌙</div>
    </div>
  </div>

  <div id="settingsMenu" class="settings-menu">
    <div class="setting-option">
      <label>
        <b>🔊 Lectura por voz</b>
        <input type="checkbox" id="voz">
      </label>
    </div>
    
    <div class="setting-option">
      <label><b>🎚 Tono de voz</b></label>
      <input type="range" id="tono" min="0.5" max="2" step="0.1" value="1">
    </div>

    <button class="btn-secondary" onclick="vaciarFavs()">🗑️ Borrar todos los favoritos</button>
  </div>

  <div id="chat" class="chat">
    <div class="msg ia">¡Hola! Escribí qué querés cocinar (pizza, lasaña, empanadas, brownie...) y te paso la receta exacta.</div>
  </div>

  <input id="input" placeholder="Ej: pizza italiana, milanesas, brownies, tacos..." onkeydown="if(event.key==='Enter') enviar()">

  <select id="idioma">
    <option value="es">Español</option>
    <option value="en">English</option>
    <option value="pt">Português</option>
    <option value="fr">Français</option>
    <option value="it">Italiano</option>
  </select>

  <button id="btn" onclick="enviar()">Generar receta</button>

  <div class="fav-box">
    <b>⭐ Recetas Favoritas</b>
    <div id="fav"></div>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('SW activo:', reg.scope))
      .catch(err => console.error('Error SW:', err));
  });
}

const chat=document.getElementById("chat");
const input=document.getElementById("input");
const idioma=document.getElementById("idioma");
const btn=document.getElementById("btn");
const favBox=document.getElementById("fav");
const settingsMenu=document.getElementById("settingsMenu");
const voz=document.getElementById("voz");
const tono=document.getElementById("tono");

function toggleDark(){
  document.body.classList.toggle("dark");
}

function toggleSettings(){
  settingsMenu.classList.toggle("open");
}

let favs=JSON.parse(localStorage.getItem("favs"))||[];

function guardarFav(t){
  if(!favs.includes(t)){
    favs.push(t);
    localStorage.setItem("favs",JSON.stringify(favs));
    pintarFav();
  }
}

function borrarFav(texto){
  favs=favs.filter(f=>f!==texto);
  localStorage.setItem("favs",JSON.stringify(favs));
  pintarFav();
}

function vaciarFavs(){
  if(confirm("¿Seguro que querés borrar todos los favoritos?")){
    favs=[];
    localStorage.removeItem("favs");
    pintarFav();
  }
}

function pintarFav(){
  favBox.innerHTML="";
  if(favs.length === 0){
    favBox.innerHTML = "<small style='color:gray;'>No hay favoritas guardadas</small>";
    return;
  }
  favs.forEach(f=>{
    const d=document.createElement("div");
    d.className="fav-item";
    d.innerHTML=`
    <span>⭐ ${f}</span>
    <div>
      <button onclick="borrarFav('${f}')">🗑</button>
    </div>
    `;
    favBox.appendChild(d);
  });
}
pintarFav();

function hablar(texto, lang) {
  if (!voz.checked) return;
  
  let textoLimpio = texto.replace(/<[^>]*>?/gm, '');
  textoLimpio = textoLimpio.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}\u{1F6D0}-\u{1F6FF}\u{1F004}\u{1F0CF}\u{1F170}-\u{1F251}]/gu, '');

  const mapaIdiomas = {
    'es': 'es-ES',
    'en': 'en-US',
    'pt': 'pt-BR',
    'fr': 'fr-FR',
    'it': 'it-IT'
  };

  const s = new SpeechSynthesisUtterance(textoLimpio);
  s.pitch = parseFloat(tono.value);
  s.lang = mapaIdiomas[lang] || 'es-ES';
  speechSynthesis.cancel();
  speechSynthesis.speak(s);
}

// DICCIONARIO ANTI-SPANGLISH (Traductor inteligente)
const diccionarioGastronomico = {
  "breadfruit": "fruta del pan",
  "water": "agua",
  "oil": "aceite",
  "lettuce": "lechuga",
  "codfish": "bacalao",
  "salt": "sal",
  "pepper": "pimienta",
  "onion": "cebolla",
  "garlic": "ajo",
  "flour": "harina",
  "sugar": "azúcar",
  "butter": "manteca",
  "milk": "leche",
  "egg": "huevo",
  "eggs": "huevos",
  "chicken": "pollo",
  "beef": "carne de res",
  "pork": "cerdo",
  "cheese": "queso",
  "tomato": "tomate",
  "as required": "cantidad necesaria",
  "to taste": "a gusto",
  "for frying": "para freír",
  "slice": "cortar en rodajas",
  "fry": "freír",
  "boil": "hervir",
  "bake": "hornear"
};

function traducirSpanglish(texto) {
  let resultado = texto;
  Object.keys(diccionarioGastronomico).forEach(clave => {
    const regex = new RegExp("\\b" + clave + "\\b", "gi");
    resultado = resultado.replace(regex, diccionarioGastronomico[clave]);
  });
  return resultado;
}

// RECETARIO EXACTO PARA PLATOS POPULARES
const recetasEspecificas = {
  "pizza": `<b>🍳 PIZZA ITALIANA TRADICIONAL</b><br><br>
<b>⏱️ Tiempo:</b> 45 min | <b>Dificultad:</b> Fácil<br><br>
<b>🛒 Ingredientes exactos:</b><br>
- 250g de harina 000 (o común)<br>
- 150ml de agua tibia<br>
- 5g de levadura seca<br>
- 1 cucharada de aceite de oliva<br>
- 1/2 cucharadita de sal<br>
- 100g de salsa de tomate<br>
- 150g de queso mozzarella<br>
- Orégano a gusto<br><br>
<b>🔥 Paso a Paso para principiantes:</b><br>
1. En un bowl, disolvé la levadura en el agua tibia y dejá reposar 5 minutos.<br>
2. Agregá la harina, la sal y el aceite. Mezclá y amasá durante 8 minutos hasta tener un bollo suave.<br>
3. Tapá el bollo y dejalo leudar 30 minutos.<br>
4. Estirá la masa sobre una asadera aceitada.<br>
5. Cubrí con la salsa de tomate y el queso mozzarella.<br>
6. Horneá a fuego máximo (220°C - 250°C) por 12 a 15 minutos hasta dorar la base.`,

  "papas fritas": `<b>🍳 PAPAS FRITAS CROCANTES</b><br><br>
<b>⏱️ Tiempo:</b> 25 min | <b>Dificultad:</b> Fácil<br><br>
<b>🛒 Ingredientes exactos:</b><br>
- 3 papas medianas<br>
- 1/2 litro de aceite para freír<br>
- Sal fina a gusto<br><br>
<b>🔥 Paso a Paso para principiantes:</b><br>
1. Pelá y cortá las papas en bastones de 1 cm.<br>
2. Secá las papas muy bien con papel absorbente.<br>
3. Calentá el aceite en una sartén profunda a fuego medio-alto.<br>
4. Cociná las papas durante 8-10 minutos hasta que estén doradas.<br>
5. Retirá con espumadera, escurrí en papel de cocina y agregá sal de inmediato.`,

  "hamburguesa": `<b>🍳 HAMBURGUESA CASERA JUGOSA</b><br><br>
<b>⏱️ Tiempo:</b> 15 min | <b>Dificultad:</b> Fácil<br><br>
<b>🛒 Ingredientes exactos:</b><br>
- 200g de carne picada<br>
- 1 pan de hamburguesa<br>
- 1 feta de queso cheddar<br>
- Sal y pimienta a gusto<br>
- 1 cucharada de aceite<br><br>
<b>🔥 Paso a Paso para principiantes:</b><br>
1. Formá un bollo con la carne y aplastalo hasta darle forma de disco de 1.5 cm de grosor.<br>
2. Calentá una sartén a fuego alto con un chorrito de aceite.<br>
3. Colocá la carne, condimentá con sal y pimienta. Cociná 3 minutos.<br>
4. Dala vuelta, agregá el queso encima y cociná 3 minutos más.<br>
5. Tostá el pan en la misma sartén y armá tu hamburguesa.`
};

// BUSCADOR CON FILTRO LÓGICO Y TRADUCCIÓN
async function obtenerReceta(consulta) {
  const clave = consulta.toLowerCase().trim();

  // 1. Recetas locales exactas
  for (let k in recetasEspecificas) {
    if (clave.includes(k)) {
      return recetasEspecificas[k];
    }
  }

  // 2. Búsqueda en API gastronómica libre (TheMealDB)
  try {
    const res = await fetch(`https://www.themealdb.com/api/json/v1/1/search.php?s=${encodeURIComponent(clave)}`);
    if (res.ok) {
      const data = await res.json();
      if (data.meals && data.meals.length > 0) {
        const plato = data.meals[0];
        
        let ingredientesHTML = "";
        for (let i = 1; i <= 15; i++) {
          const ing = plato[`strIngredient${i}`];
          const cant = plato[`strMeasure${i}`];
          if (ing && ing.trim() !== "") {
            ingredientesHTML += `- ${traducirSpanglish(ing)} (${cant ? traducirSpanglish(cant.trim()) : 'a gusto'})<br>`;
          }
        }

        let instrucciones = traducirSpanglish(plato.strInstructions);

        return `<b>🍳 ${traducirSpanglish(plato.strMeal).toUpperCase()}</b><br><br>
<b>⏱️ Tiempo:</b> 30 min | <b>Dificultad:</b> Fácil<br><br>
<b>🛒 Ingredientes exactos:</b><br>
${ingredientesHTML}<br>
<b>🔥 Paso a Paso para principiantes:</b><br>
${instrucciones.replace(/\r\n|\r|\n/g, "<br>")}`;
      }
    }
  } catch (e) {
    console.log("Fallback a generador lógico");
  }

  // 3. Fallback inteligente por estructura gastronómica
  const esMasa = clave.includes("pizza") || clave.includes("pan") || clave.includes("tarta") || clave.includes("empanada");
  const esDulce = clave.includes("torta") || clave.includes("brownie") || clave.includes("galleta") || clave.includes("bizcocho");

  if (esMasa) {
    return `<b>🍳 PREPARACIÓN DE ${clave.toUpperCase()} CASERA</b><br><br>
<b>⏱️ Tiempo:</b> 40 min | <b>Dificultad:</b> Fácil<br><br>
<b>🛒 Ingredientes para la base:</b><br>
- 300g de harina común<br>
- 150ml de agua tibia<br>
- 1 cucharada de aceite<br>
- 1 pizca de sal<br>
- Relleno o cobertura a elección<br><br>
<b>🔥 Paso a Paso para principiantes:</b><br>
1. En un bowl, mezclá la harina, la sal, el aceite y el agua tibia.<br>
2. Amasá durante 7 minutos hasta tener una masa uniforme.<br>
3. Dejá reposar la masa tapada durante 15 minutos.<br>
4. Estirá sobre una fuente aceitada y agregá los ingredientes por encima.<br>
5. Llevá a horno precalentado a 200°C por 15-20 minutos.`;
  }

  if (esDulce) {
    return `<b>🍳 PREPARACIÓN DE ${clave.toUpperCase()} DULCE</b><br><br>
<b>⏱️ Tiempo:</b> 35 min | <b>Dificultad:</b> Fácil<br><br>
<b>🛒 Ingredientes exactos:</b><br>
- 200g de harina leudante<br>
- 100g de azúcar<br>
- 2 huevos<br>
- 50g de manteca derretida<br>
- 1 cucharadita de esencia de vainilla<br><br>
<b>🔥 Paso a Paso para principiantes:</b><br>
1. Batí los huevos con el azúcar en un bowl.<br>
2. Integrá la manteca derretida y la vainilla.<br>
3. Agregá la harina tamizada de a poco mezclando con espátula.<br>
4. Verté en un molde enharinado y horneá a 180°C por 25 minutos.`;
  }

  return `<b>🍳 PREPARACIÓN DE ${clave.toUpperCase()}</b><br><br>
<b>⏱️ Tiempo:</b> 25 min | <b>Dificultad:</b> Fácil<br><br>
<b>🛒 Ingredientes principales:</b><br>
- Ración principal para ${clave}<br>
- 1 cebolla y verduras a elección<br>
- Sal, pimienta y condimentos a gusto<br>
- 2 cucharadas de aceite<br><br>
<b>🔥 Paso a Paso para principiantes:</b><br>
1. Picá las verduras en cubos pequeños.<br>
2. Saltéalas en una sartén con aceite a fuego medio por 5 minutos.<br>
3. Agregá la proteína o ingrediente principal y condimentá.<br>
4. Cociná revolviendo a fuego medio por 12-15 minutos hasta completar la cocción.`;
}

async function enviar(){
  const t = input.value.trim();
  if(!t) return;

  btn.disabled = true;
  chat.innerHTML += `<div class="msg user">${t}</div>`;

  const ia = document.createElement("div");
  ia.className = "msg ia";
  ia.innerHTML = "🔍 Preparando la receta paso a paso...";
  chat.appendChild(ia);
  chat.scrollTop = chat.scrollHeight;

  let resultado = await obtenerReceta(t);

  ia.innerHTML = resultado;

  const b = document.createElement("button");
  b.style.width = "auto";
  b.style.marginTop = "8px";
  b.innerText = "⭐ Guardar";
  b.onclick = () => guardarFav(t);
  ia.appendChild(b);

  hablar(resultado, idioma.value);

  input.value = "";
  chat.scrollTop = chat.scrollHeight;
  btn.disabled = false;
}
</script>

</body>
</html>
